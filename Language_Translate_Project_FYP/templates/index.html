<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Language Translator</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #121212;
            color: #f5f5f5;
            font-family: 'Inter', sans-serif;
        }
        .glass {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px;
        }
        .accent {
            background-color: #00bfff; /* Electric Blue */
            transition: transform 0.2s ease, background-color 0.2s ease;
        }
        .accent:hover {
            background-color: #0099cc;
            transform: scale(1.05);
        }
        select,
        select option {
            background-color: rgba(255, 255, 255, 0.08);
            color: #f5f5f5;
        }
        select {
            border-color: rgba(148, 163, 184, 0.3);
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            padding-right: 2.5rem;
            background-image: linear-gradient(45deg, transparent 50%, #f5f5f5 50%), linear-gradient(135deg, #f5f5f5 50%, transparent 50%);
            background-position: calc(100% - 1rem) calc(50% - 0.25rem), calc(100% - 0.75rem) calc(50% - 0.25rem);
            background-size: 0.5rem 0.5rem, 0.5rem 0.5rem;
            background-repeat: no-repeat;
        }
        select option {
            background-color: #121212;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="glass p-8 max-w-2xl w-full">
        <h1 class="text-3xl font-bold text-center mb-8">Language Translator</h1>
        
        <div class="mb-6">
            <textarea id="text-input" class="w-full p-4 bg-transparent border border-gray-600 rounded-lg text-white placeholder-gray-400 resize-none" rows="6" placeholder="Enter text to translate..."></textarea>
        </div>
        
        <div class="mb-6 flex items-center justify-between">
            <label for="lang-select" class="text-lg">Translate to:</label>
            <select id="lang-select" class="bg-transparent border border-gray-600 rounded-lg p-2 text-white">
                {% for code, name in langs.items() %}
                <option value="{{ code }}">{{ name }}</option>
                {% endfor %}
            </select>
        </div>
        
        <div class="mb-6">
            <button id="translate-btn" class="accent text-white px-6 py-3 rounded-lg w-full font-semibold hover:opacity-90 transition">Translate</button>
        </div>
        
        <div class="mb-6">
            <textarea id="translated-output" class="w-full p-4 bg-transparent border border-gray-600 rounded-lg text-white resize-none" rows="6" readonly placeholder="Translated text will appear here..."></textarea>
        </div>
        
        <div class="mb-6">
            <label for="file-upload" class="block mb-2 text-lg">Upload Document (PDF/DOCX):</label>
            <input type="file" id="file-upload" accept=".pdf,.docx" class="mb-2 text-white">
            <button id="upload-btn" class="accent text-white px-4 py-2 rounded-lg font-semibold hover:opacity-90 transition">Upload & Translate</button>
        </div>
    </div>

    <script>
        const translateBtn = document.getElementById('translate-btn');
        const uploadBtn = document.getElementById('upload-btn');
        const textInput = document.getElementById('text-input');
        const langSelect = document.getElementById('lang-select');
        const translatedOutput = document.getElementById('translated-output');
        const fileUpload = document.getElementById('file-upload');

        translateBtn.addEventListener('click', async () => {
            const text = textInput.value.trim();
            const lang = langSelect.value;
            if (!text) {
                alert('Please enter text to translate.');
                return;
            }
            translateBtn.disabled = true;
            translateBtn.textContent = 'Translating...';
            try {
                const response = await fetch('/translate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text, lang })
                });
                const data = await response.json();
                if (data.translated) {
                    translatedOutput.value = data.translated;
                } else {
                    alert('Error: ' + data.error);
                }
            } catch (error) {
                alert('Network error: ' + error.message);
            } finally {
                translateBtn.disabled = false;
                translateBtn.textContent = 'Translate';
            }
        });

        uploadBtn.addEventListener('click', async () => {
            const file = fileUpload.files[0];
            const lang = langSelect.value;
            if (!file) {
                alert('Please select a file to upload.');
                return;
            }
            uploadBtn.disabled = true;
            uploadBtn.textContent = 'Uploading...';
            try {
                const formData = new FormData();
                formData.append('file', file);
                formData.append('lang', lang);
                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                if (data.translated) {
                    translatedOutput.value = data.translated;
                } else {
                    alert('Error: ' + data.error);
                }
            } catch (error) {
                alert('Network error: ' + error.message);
            } finally {
                uploadBtn.disabled = false;
                uploadBtn.textContent = 'Upload & Translate';
            }
        });
    </script>
</body>
</html>
